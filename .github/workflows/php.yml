          git config --global user.name "sinavm"
          git config credential.helper store

          git rm -r --cached cache lite/cache hiddify-cli sing-box-bin reports/invalid.txt lite/reports/invalid.txt reports/singbox-test.log lite/reports/singbox-test.log 2>/dev/null || true

          for i in {1..3}; do
            git pull --rebase
            git add -A
            commit_message="👸 Lite Servers Updated - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "$commit_message" --allow-empty
            git push && break || sleep 5
          done
