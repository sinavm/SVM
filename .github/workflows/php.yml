                          if (!isset($tags[$target])) {
                              fwrite(STDERR, "Outbound[{$index}] references missing tag '{$target}': {$file}" . PHP_EOL);
                              exit(1);
                          }
                      }
                  }
              }
              echo "Outbound references valid: {$file}" . PHP_EOL;
          }
          PHP

          for f in subscriptions/singbox/*.json; do
            [ -f "$f" ] || continue
            echo "Checking sing-box: $f"
            sing-box check -c "$f"
