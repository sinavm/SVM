          gunzip -f /tmp/mihomo.gz
          sudo install -m 0755 /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Execute PHP script
        run: |
          set -euo pipefail
          git config pull.rebase true
