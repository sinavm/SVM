name: "Let's SiNAVM!"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

concurrency:
  group: "sinavm-full"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sinavm-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_LINK_SINAVM_1: ${{ secrets.PRIVATE_LINK_SINAVM_1 || secrets.PRIVATE_LINK_SiNAVM_1 }}
      PRIVATE_LINK_SINAVM_2: ${{ secrets.PRIVATE_LINK_SINAVM_2 || secrets.PRIVATE_LINK_SiNAVM_2 }}
      PRIVATE_LINK_SINAVM_3: ${{ secrets.PRIVATE_LINK_SINAVM_3 || secrets.PRIVATE_LINK_SiNAVM_3 }}
      PRIVATE_LINK_SINAVM_4: ${{ secrets.PRIVATE_LINK_SINAVM_4 || secrets.PRIVATE_LINK_SiNAVM_4 }}
      PRIVATE_LINK_SINAVM_5: ${{ secrets.PRIVATE_LINK_SINAVM_5 || secrets.PRIVATE_LINK_SiNAVM_5 }}
      PRIVATE_LINK_SINAVM_6: ${{ secrets.PRIVATE_LINK_SINAVM_6 || secrets.PRIVATE_LINK_SiNAVM_6 }}
      SINGBOX_VERSION: "1.14.0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none

      - name: Install sing-box
        run: |
          set -euo pipefail
          VER="${SINGBOX_VERSION:-1.14.0}"
          curl -L --retry 5 --retry-delay 2 -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Execute PHP script
        run: |
          set -euo pipefail
          git config pull.rebase true
          git config rebase.autoStash true
          git pull --rebase

          php -d display_errors get.php
          php -d display_errors config-test.php
          php -d display_errors channelsAssets.php || true
          php -d display_errors duplicate.php
          php -d display_errors sort.php
          php -d display_errors toSingbox.php
          php -d display_errors toClashSurfboard.php
          php -d display_errors toClashMetaExtra.php || true
          php -d display_errors hiddifyWarp.php

          git config --global user.email "sina.bb2006@gmail.com"
          git config --global user.name "sinavm"
          git config credential.helper store

          git rm -r --cached cache lite/cache hiddify-cli sing-box-bin reports/invalid.txt lite/reports/invalid.txt reports/singbox-test.log 2>/dev/null || true

          for i in {1..3}; do
            git pull --rebase
            git add -A
            commit_message="👷‍♂️ Servers Updated - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "$commit_message" --allow-empty
            git push && break || sleep 5
          done

  sinavm-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: sinavm-full
    env:
      PRIVATE_LINK_SINAVM_1: ${{ secrets.PRIVATE_LINK_SINAVM_1 || secrets.PRIVATE_LINK_SiNAVM_1 }}
      PRIVATE_LINK_SINAVM_2: ${{ secrets.PRIVATE_LINK_SINAVM_2 || secrets.PRIVATE_LINK_SiNAVM_2 }}
      PRIVATE_LINK_SINAVM_3: ${{ secrets.PRIVATE_LINK_SINAVM_3 || secrets.PRIVATE_LINK_SiNAVM_3 }}
      PRIVATE_LINK_SINAVM_4: ${{ secrets.PRIVATE_LINK_SINAVM_4 || secrets.PRIVATE_LINK_SiNAVM_4 }}
      PRIVATE_LINK_SINAVM_5: ${{ secrets.PRIVATE_LINK_SINAVM_5 || secrets.PRIVATE_LINK_SiNAVM_5 }}
      PRIVATE_LINK_SINAVM_6: ${{ secrets.PRIVATE_LINK_SINAVM_6 || secrets.PRIVATE_LINK_SiNAVM_6 }}
      SINGBOX_VERSION: "1.14.0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none

      - name: Install sing-box
        run: |
          set -euo pipefail
          VER="${SINGBOX_VERSION:-1.14.0}"
          curl -L --retry 5 --retry-delay 2 -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Execute PHP script
        run: |
          set -euo pipefail
          git config pull.rebase true
          git config rebase.autoStash true
          git pull --rebase

          cd lite
          php -d display_errors ../get.php
          php -d display_errors ../config-test.php
          php -d display_errors duplicate.php
          php -d display_errors sort.php
          php -d display_errors ../toSingbox.php
          php -d display_errors ../toClashSurfboard.php
          php -d display_errors ../toClashMetaExtra.php || true

          git config --global user.email "sina.bb2006@gmail.com"
          git config --global user.name "sinavm"
          git config credential.helper store

          git rm -r --cached cache lite/cache hiddify-cli sing-box-bin reports/invalid.txt lite/reports/invalid.txt reports/singbox-test.log lite/reports/singbox-test.log 2>/dev/null || true

          for i in {1..3}; do
            git pull --rebase
            git add -A
            commit_message="👸 Lite Servers Updated - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "$commit_message" --allow-empty
            git push && break || sleep 5
          done
