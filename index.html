<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVM اشتراک</title>
<style>
body{font-family:sans-serif;background:#020617;color:#e2e8f0;margin:0;padding:24px}
.wrap{max-width:520px;margin:auto}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:16px;margin:12px 0}
a{color:#67e8f9}
.stat{display:flex;justify-content:space-between;color:#94a3b8;font-size:14px}
img.qr{background:#fff;border-radius:12px;padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>SVM</h1>
  <p id="status-line">در حال خواندن وضعیت…</p>
  <div class="card">
    <h2>کامل</h2>
    <p><a id="full-raw" href="https://raw.githubusercontent.com/sinavm/SVM/main/subscriptions/xray/normal/mix">raw mix</a></p>
    <p><a href="https://cdn.jsdelivr.net/gh/sinavm/SVM@main/subscriptions/xray/normal/mix">jsDelivr mix</a></p>
  </div>
  <div class="card">
    <h2>لایت جمورع</h2>
    <p><a id="lite-raw" href="https://raw.githubusercontent.com/sinavm/SVM/main/lite/subscriptions/xray/normal/alive-fast">raw alive-fast</a></p>
    <p><a href="https://cdn.jsdelivr.net/gh/sinavm/SVM@main/lite/subscriptions/xray/normal/alive-fast">jsDelivr alive-fast</a></p>
    <p><img class="qr" width="160" height="160" alt="QR lite" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https%3A%2F%2Fraw.githubusercontent.com%2Fsinavm%2FSVM%2Fmain%2Flite%2Fsubscriptions%2Fxray%2Fnormal%2Falive-fast"></p>
  </div>
  <p><a href="https://t.me/sinavm">تلگرام</a> · <a href="https://github.com/sinavm/SVM">گیتهاب</a></p>
</div>
<script>
fetch('https://raw.githubusercontent.com/sinavm/SVM/main/reports/test.json')
  .then(r=>r.json())
  .then(j=>{
    const el=document.getElementById('status-line');
    el.textContent = 'زنده: ' + (j.kept||'?') + ' از ' + (j.input||'?') + ' · آپدیت: ' + (j.tested_at||'');
  })
  .catch(()=>{});
</script>
</body>
</html>
