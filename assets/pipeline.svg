<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">SVM processing pipeline</title><desc id="desc">Collect, validate, sort and publish subscription nodes</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b59"/><stop offset="1" stop-color="#0b6685"/></linearGradient><linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect width="1200" height="250" rx="26" fill="url(#bg)"/>
<g opacity=".12" stroke="#dbeafe"><path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200"/><path d="M100 0V250M200 0V250M300 0V250M400 0V250M500 0V250M600 0V250M700 0V250M800 0V250M900 0V250M1000 0V250M1100 0V250"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(150 108)"><circle r="39" fill="#ffffff" fill-opacity=".12" stroke="#7dd3fc" stroke-width="2"/><path d="M-14 0h28M0-14v28" stroke="#eff6ff" stroke-width="5" stroke-linecap="round"/><text y="70" fill="#fff" font-size="19" font-weight="700">COLLECT</text><text y="94" fill="#c5defa" font-size="12">Gather sources</text></g>
<g transform="translate(450 108)"><circle r="39" fill="#ffffff" fill-opacity=".12" stroke="#7dd3fc" stroke-width="2"/><path d="m-17 1 11 11 23-26" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text y="70" fill="#fff" font-size="19" font-weight="700">VALIDATE</text><text y="94" fill="#c5defa" font-size="12">Test and verify</text></g>
<g transform="translate(750 108)"><circle r="39" fill="#ffffff" fill-opacity=".12" stroke="#7dd3fc" stroke-width="2"/><path d="M-17-12h34M-17 0h24M-17 12h14" stroke="#eff6ff" stroke-width="5" stroke-linecap="round"/><text y="70" fill="#fff" font-size="19" font-weight="700">SORT</text><text y="94" fill="#c5defa" font-size="12">Deduplicate and rank</text></g>
<g transform="translate(1050 108)"><circle r="39" fill="#ffffff" fill-opacity=".12" stroke="#34d399" stroke-width="2"/><path d="M-17 0h27m-9-10 10 10-10 10" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text y="70" fill="#fff" font-size="19" font-weight="700">PUBLISH</text><text y="94" fill="#c5defa" font-size="12">Build client outputs</text></g>
</g>
<g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"><path d="M205 108h190m110 0h190m110 0h190"/></g>
<g fill="#7dd3fc"><circle cx="300" cy="108" r="4"/><circle cx="600" cy="108" r="4"/><circle cx="900" cy="108" r="4"/></g>
</svg>