<svg xmlns="http://www.w3.org/2000/svg" width="460" height="104" viewBox="0 0 460 104" role="img" aria-labelledby="title desc">
<title id="title">ستاره دادن به پروژه SVM</title>
<desc id="desc">برای حمایت از توسعه پروژه، صفحه مخزن را باز کنید و دکمه Star را بزنید</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="2" y="2" width="456" height="100" rx="23" fill="#111827" stroke="#f59e0b" stroke-opacity=".42" stroke-width="2"/>
<rect x="3" y="3" width="454" height="98" rx="22" fill="url(#shine)"/>
<circle cx="60" cy="52" r="29" fill="url(#g)"/>
<path d="m60 32 6.2 12.6 13.9 2-10.1 9.8 2.4 13.8L60 63.7 47.6 70.2 50 56.4l-10.1-9.8 13.9-2z" fill="#fff"/>
<text x="270" y="47" text-anchor="middle" fill="#fff" font-family="Vazirmatn,Tahoma,sans-serif" font-size="21" font-weight="800" direction="rtl" unicode-bidi="plaintext">برای حمایت، ستاره بده</text>
<text x="270" y="73" text-anchor="middle" fill="#fcd34d" font-family="Vazirmatn,Tahoma,sans-serif" font-size="13" font-weight="600" direction="rtl" unicode-bidi="plaintext">صفحه مخزن را باز کن و Star را بزن</text>
<path d="M420 43v18m-9-9h18" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round"/>
</svg>